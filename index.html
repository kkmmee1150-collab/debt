<script>
var booting=true,CFG=window.APP_CONFIG||{};


var KEY="debtapp1";
var CATS=["อาหาร","เดินทาง","ค่าน้ำไฟ","ของใช้","อื่นๆ"];


var def={v:2,salary:16390,ot:0,groups:[{id:1,name:"ค่าห้อง"},{id:2,name:"ค่าใช้จ่ายประจำ"}],
fixed:[{id:11,g:1,name:"ห้อง",amt:5000},{id:12,g:1,name:"ส่วนกลาง",amt:0},{id:13,g:1,name:"ไฟฟ้า",amt:0},{id:14,g:1,name:"น้ำ",amt:0},{id:15,g:1,name:"เน็ตห้อง",amt:0},{id:16,g:2,name:"โทนสับ2",amt:0},{id:17,g:2,name:"เน็ตโทรสับ",amt:0},{id:18,g:2,name:"จัดฟัน",amt:0}],
debts:[{id:1,name:"KTC",bal:26185,min:810},{id:2,name:"AEON",bal:6211,min:600},{id:3,name:"Umay",bal:21493,min:650},{id:4,name:"UCHOOSE",bal:23482.91,min:2500},{id:5,name:"This shop",bal:14619,min:2346},{id:6,name:"UFUND",bal:0,min:0}],tx:[]};
function cp(o){return JSON.parse(JSON.stringify(o))}
var S;try{S=JSON.parse(localStorage.getItem(KEY))||cp(def)}catch(e){S=cp(def)}
if(S.v!=2){var oldRent=S.rent||0,d2=cp(def);S.v=2;S.groups=d2.groups;S.fixed=d2.fixed;S.fixed[0].amt=oldRent;delete S.rent;if(!S.debts.some(function(x){return x.name.toLowerCase()=="ufund"}))S.debts.push({id:Date.now(),name:"UFUND",bal:0,min:0});save()}
if(!S.plan)S.plan={living:3500,save:500,strat:"apr"};S.debts.forEach(function(d){if(d.apr==null)d.apr=/this shop/i.test(d.name)?0:16});
if(!S.sh)S.sh={url:"",token:""};if(!S.q)S.q=[];if(CFG.url)S.sh={url:CFG.url,token:CFG.token||""};if(S.rev==null)S.rev=0;if(!S.dev)S.dev=Math.random().toString(36).slice(2,8);if(!S.bud)S.bud={amt:null,at:0,pay:0};if(!S.cb)S.cb={};if(!S.rules)S.rules={};if(S.ocrOnly==null)S.ocrOnly=1;if(!S.theme)S.theme="auto";if(!S.shop)S.shop=[];if(!S.seen)S.seen={};if(!S.hist)S.hist={};if(!S.carry)S.carry={};if(!S.quick)S.quick=[{id:1,name:"ข้าว",amt:60,cat:"อาหาร"},{id:2,name:"ค่ารถ",amt:40,cat:"เดินทาง"},{id:3,name:"น้ำ/ขนม",amt:30,cat:"อาหาร"}];
var tab="home",cat="อาหาร",pend=null,busy=false,msg="",sheet=null;

function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){return iso(new Date())}
function mk(){return today().slice(0,7)}
function f(n){return Math.round(n).toLocaleString("th-TH")}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function gcol(id){var i=S.groups.findIndex(function(g){return g.id==id});return GC[(i<0?0:i)%GC.length]}
function gsum(id){return S.fixed.filter(function(x){return x.g==id}).reduce(function(a,x){return a+x.amt},0)}
function monthTx(k){k=k||mk();return S.tx.filter(function(t){return t.date.slice(0,7)==k})}
function paid(id,k){return monthTx(k).filter(function(t){return t.debt==id}).reduce(function(a,t){return a+t.amt},0)}

function guess(n){if(/ข้าว|กิน|น้ำ|กาแฟ|อาหาร|ขนม|เซเว่น/.test(n))return"อาหาร";if(/รถ|bts|mrt|แท็กซี่|วิน|เดินทาง|น้ำมัน|grab/i.test(n))return"เดินทาง";if(/ไฟ|ประปา|เน็ต|โทรศัพท์|เติมเงิน/.test(n))return"ค่าน้ำไฟ";return"อื่นๆ"}

/* ---- transactions ---- */

function pay(id,def){var d=S.debts.filter(function(x){return x.id==id})[0];var a=parseFloat(prompt("จ่าย "+d.name+" กี่บาท?",def!=null?Math.round(def):d.min));if(a>0)addTx(a,"","",null,id)}

function editTx(id){var t=S.tx.filter(function(x){return x.id==id})[0];if(!t)return;var a=parseFloat(prompt("แก้จำนวนเงิน",t.amt));if(isNaN(a)||a<0)return;if(t.debt){var d=S.debts.filter(function(x){return x.id==t.debt})[0];if(d)d.bal=Math.max(0,d.bal+t.amt-a)}t.amt=a;qAdd({a:"upsert",id:String(t.id),row:txRowData(t)});if(t.debt)syncDebts();save();render()}




function setNum(k,v){S[k]=parseFloat(v)||0;save();render()}

/* ---- editors: fixed items, groups, debts ---- */
function setF(id,k,v){var x=S.fixed.filter(function(y){return y.id==id})[0];x[k]=k=="amt"?(parseFloat(v)||0):k=="g"?+v:v;save();render()}
function delF(id){S.fixed=S.fixed.filter(function(y){return y.id!=id});save();render()}
function addF(g){S.fixed.push({id:Date.now(),g:g,name:"รายการใหม่",amt:0});save();render()}

function simulate(strat,pool,roll,shock){
 var ds=S.debts.filter(function(d){return d.bal>0}).map(function(d){return{id:d.id,bal:d.bal,min:d.min,apr:d.apr||0}});

 while(m<240&&ds.some(function(d){return d.bal>0.5})){
  m++;ds.forEach(function(d){if(d.bal>0){var i=d.bal*d.apr/1200;d.bal+=i;interest+=i}});
  var bg=(m==1&&shock)?Math.max(minsAll,budget-shock):budget,left=bg;
  order.forEach(function(d){if(d.bal>0){var p=Math.min(d.bal,d.min);d.bal-=p;left-=p}});
  if(roll)order.forEach(function(d){if(d.bal>0&&left>0){var p=Math.min(d.bal,left);d.bal-=p;left-=p}});
  ds.forEach(function(d){if(d.bal<=0.5)d.bal=0});
  if(!ds.some(function(d){return d.bal>0}))exact=(m-1)+(bg-left)/bg;
  series.push(tot())}
 return{months:m,exact:exact||m,done:!ds.some(function(d){return d.bal>0.5}),interest:interest,series:series}}

async function syncPush(force){

 syncing=true;
 try{
  var j=await srv([{a:"state",base:S.rev,dev:S.dev,force:!!force,data:JSON.stringify(buildBlob()),tables:buildTables()}]),p=j.res&&j.res[0];
  if(!j.ok)shNote("ชีตปฏิเสธ: เช็กรหัสลับ (TOKEN)");
  else if(!p)shNote("สคริปต์ชีตยังเป็นเวอร์ชันเก่า ให้อัปเดตสคริปต์ก่อน");
  else if(p.conflict){syncing=false;await syncPull();return}
  else{S.rev=p.rev;S.dirty=0;S.lastSync=Date.now();lsSave();shNote("ซิงก์ล่าสุด "+hhmm())}
 }catch(e){shNote("ซิงก์ไม่สำเร็จ จะลองใหม่ตอนมีเน็ต")}
 syncing=false}
async function syncPull(force){

 pulling=true;
 try{
  var j=await srv([{a:"pull"}]),p=j.res&&j.res[0];
  if(!j.ok){shNote("ชีตปฏิเสธ: เช็กรหัสลับ (TOKEN)");pulling=false;return}
  if(!p){shNote("สคริปต์ชีตยังเป็นเวอร์ชันเก่า ให้อัปเดตสคริปต์ก่อน");pulling=false;return}
  if(force&&!(p.rev>0)){shNote("ชีตยังไม่มีข้อมูลให้ดึง");pulling=false;return}
  if(p.rev>S.rev||force){
   var ask=!force&&((S.dirty&&S.touched)||(S.rev==0&&!looksDefault())),useRemote=true;
   if(ask)useRemote=confirm("พบข้อมูลบนชีตที่ต่างจากเครื่องนี้\n\nกด OK = ใช้ข้อมูลจากชีต (ข้อมูลในเครื่องนี้จะถูกแทนที่ โดยสำรองไว้ให้)\nกดยกเลิก = ใช้ข้อมูลเครื่องนี้ ส่งทับชีต");
   if(useRemote&&p.data){
    try{localStorage.setItem(KEY+"_bak",JSON.stringify(S))}catch(e){}
    applyBlob(JSON.parse(p.data));S.rev=p.rev;S.dirty=0;S.lastSync=Date.now();lsSave();render();shNote("ดึงข้อมูลล่าสุดจากชีตแล้ว "+hhmm());toast("ซิงก์ข้อมูลล่าสุดจากชีตแล้ว")
   }else{S.rev=p.rev;S.dirty=1;S.touched=1;lsSave();pulling=false;await syncPush(true);return}
  }else if(S.dirty||(S.touched&&p.rev==0)||(p.rev==0&&S.rev==0&&!looksDefault())){pulling=false;await syncPush(true);return}
  else shNote("ข้อมูลเป็นปัจจุบัน "+hhmm());
 }catch(e){shNote("ซิงก์ไม่สำเร็จ (ออฟไลน์หรือ URL ผิด)")}

 var inc=type=="in",t={id:Date.now()+Math.random(),date:date||today(),amt:amt,cat:debt?"จ่ายหนี้":c,note:note||""},dn="";
 if(inc)t.type="in";if(x){if(x.time)t.time=x.time;if(x.to)t.to=x.to;if(x.ref)t.ref=x.ref}
 if(debt){var d=S.debts.filter(function(x){return x.id==debt})[0];if(d){t.debt=debt;d.bal=Math.max(0,d.bal-amt);t.note=d.name;dn=d.name}}
 S.tx.unshift(t);qAdd({a:"upsert",id:String(t.id),row:txRowData(t)});if(t.debt)syncDebts();checkCele(t);save();render();
 var bi=(!inc&&!t.debt&&c!="เงินออม")?budInfo():null,w="";
 if(!inc&&!t.debt){var cv=(S.cb||{})[c]||0;if(cv>0){var p=Math.round(catUsed(c)/cv*100);if(p>=80)w=p>=100?` · ${c}เกินงบแล้ว`:` · ${c}ใช้ไป ${p}% ของงบ`}}
 if(!sheet)toast((inc?`บันทึกรายรับ ${note||c} ${f(amt)} ฿ แล้ว`:t.debt?`จ่าย ${dn} ${f(amt)} ฿ แล้ว`:`บันทึก ${note||c} ${f(amt)} ฿ แล้ว`)+w+(bi&&!w?` · วันนี้เหลือ ${f(bi.todayLeft)} ฿`:""),"เลิกทำ",function(){rmTx(t.id)});return t.id}

function waterfall(c){
 var r1=c.inc-c.fx,r2=r1-c.commit,r3=r2-c.spent;
 var it=[["รายได้",0,c.inc,"var(--pm)",c.inc],["ประจำ",r1,c.inc,"var(--g2)",c.fx],["หนี้",r2,r1,"var(--am)",c.commit],["ใช้จ่าย",r3,r2,"var(--g1)",c.spent],["เหลือ",Math.min(0,c.left),Math.max(0,c.left),c.left<0?"var(--am)":"var(--pri2)",c.left]];
 var mx=Math.max(c.inc,1),mn=Math.min(0,c.left,r3),rng=(mx-mn)||1,y=function(v){return 24+(mx-v)/rng*108},s="";
 it.forEach(function(o,i){var lo=Math.min(o[1],o[2]),hi=Math.max(o[1],o[2]);if(i==0){lo=0;hi=c.inc}var x=12+i*61,top=y(hi),h=Math.max(2,y(lo)-top);
  s+=`<rect x="${x}" y="${top}" width="44" height="${h}" rx="6" style="fill:${o[3]}"/><text x="${x+22}" y="${top-6}" text-anchor="middle" class="sv">${(i&&i<4?"−":"")+f(o[4])}</text><text x="${x+22}" y="162" text-anchor="middle">${o[0]}</text>`});
 return`<svg viewBox="0 0 320 170" role="img" aria-label="กราฟเงินไหลของเดือนนี้"><line x1="6" x2="314" y1="${y(0)}" y2="${y(0)}" class="ax"/>${s}</svg>`}
function daily(c){
 var B=c.inc-c.fx-c.commit,now=new Date().getDate(),cum=0,per={};
 monthTx().forEach(function(t){if(isOut(t)){var d=+t.date.slice(8);per[d]=(per[d]||0)+t.amt}});
 var vals=[B];for(var d=1;d<=now;d++){cum+=per[d]||0;vals.push(B-cum)}
 var mx=Math.max(B,1),mn=Math.min(0,Math.min.apply(null,vals)),rng=(mx-mn)||1,W=286,H=100;
 var X=function(d){return 22+d/c.dim*W},Y=function(v){return 18+(mx-v)/rng*H};
 var p=vals.map(function(v,i){return(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)}).join(" "),last=vals[vals.length-1],col=last<0?"var(--acc)":"var(--pri)";
 return`<svg viewBox="0 0 320 150" role="img" aria-label="เงินคงเหลือรายวัน"><line x1="22" x2="308" y1="${Y(0)}" y2="${Y(0)}" style="stroke:var(--acc);opacity:.5" stroke-dasharray="3 3"/><line x1="${X(0)}" y1="${Y(B)}" x2="${X(c.dim)}" y2="${Y(0)}" style="stroke:var(--g2)" stroke-dasharray="4 4"/><path d="${p}" fill="none" style="stroke:${col}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${X(vals.length-1)}" cy="${Y(last)}" r="5" style="fill:${col}"/><text x="22" y="12" class="sv">เหลือ ${f(last)}</text><text x="22" y="144">วันที่ 1</text><text x="308" y="144" text-anchor="end">วันที่ ${c.dim}</text></svg>`}
function lineChart(a,b,H){
 var pad=function(x){var r=x.slice(0,H+1);while(r.length<H+1)r.push(x[x.length-1]);return r},A=pad(a),B=pad(b),mx=Math.max(B[0],1),W=286,h=100;
 var X=function(i){return 22+i/H*W},Y=function(v){return 16+(mx-v)/mx*h};
 var path=function(x){return x.map(function(v,i){return(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)}).join(" ")};
 return`<svg viewBox="0 0 320 150" role="img" aria-label="หนี้รวมตามแผนเทียบจ่ายขั้นต่ำ"><path d="${path(B)}" fill="none" style="stroke:var(--g2)" stroke-width="2.5" stroke-dasharray="5 4"/><path d="${path(A)}" fill="none" style="stroke:var(--pri)" stroke-width="3.5" stroke-linecap="round"/><text x="22" y="10" class="sv">หนี้รวม ${f(mx)}</text><text x="22" y="144">ตอนนี้</text><text x="308" y="144" text-anchor="end">อีก ${H} เดือน</text></svg><p class="sub lg"><i style="background:var(--pm)"></i>ตามแผน<i style="background:var(--g2)"></i>จ่ายขั้นต่ำอย่างเดียว</p>`}

function stat(){
 var ms=monthsBack(6).map(mstat),mx=1,st=streakInfo(),tdp=0,tsv=0,tsp=0,n=0;
 ms.forEach(function(m){mx=Math.max(mx,m.inc,m.sp,m.dp,m.sv);tdp+=m.dp;tsv+=m.sv;tsp+=m.sp;if(m.sp>0)n++});
 var S4=[["บันทึกต่อเนื่อง",st.cur+" วัน","สูงสุด "+st.best+" วัน"],["จ่ายหนี้ 6 เดือน",f(tdp)+" ฿",""],["ออม 6 เดือน",f(tsv)+" ฿",""],["ใช้จ่ายเฉลี่ย/เดือน",f(n?tsp/n:0)+" ฿",""]];
 var h=closeBanner()+monthDetail()+`<section class="card span2"><div class="g2 stg">${S4.map(function(x){return`<div class="st"><span>${x[0]}</span><b class="num">${x[1]}</b>${x[2]?`<small>${x[2]}</small>`:""}</div>`}).join("")}</div></section>`;
 h+=`<section class="card"><h2>6 เดือนย้อนหลัง</h2>${barChart(ms,mx)}<p class="sub">* รายได้เดือนที่ยังไม่ปิดประมาณจากเงินเดือนปัจจุบัน</p></section>`;
 var cl=ms.filter(function(m){return S.hist[m.k]&&S.hist[m.k].debt!=null});
 h+=`<section class="card"><h2>ปิดเดือน</h2>`+(cl.length>=2?`<div class="big2 num" style="color:var(--pri)">หนี้ลดลง ${f(S.hist[cl[0].k].debt-S.hist[cl[cl.length-1].k].debt)} ฿</div><p class="sub" style="margin-bottom:12px">จาก ${mname(cl[0].k)} ถึง ${mname(cl[cl.length-1].k)}</p>`:"")+`<p class="sub" style="margin-bottom:16px">สรุปเดือนนี้ และยกยอดเงินเหลือ (หรือที่ขาด) ไปเดือนหน้า</p><button class="btn" onclick="closeMonth(mk())">ปิดเดือนนี้</button></section>`;
 h+=`<section class="card span2"><h2>รายเดือน</h2>`+ms.slice().reverse().map(function(m){var hh=S.hist[m.k];
  return`<div class="mr"><div class="li" style="border:0;padding:0"><span class="l"><b>${mname(m.k)}</b></span><span class="tag${m.closed?" ok":""}">${m.closed?"ปิดแล้ว":m.k==mk()?"เดือนนี้":"ยังไม่ปิด"}</span></div><div class="g4"><span>รายได้${m.est?"*":""}<b class="num">${f(m.inc)}</b></span><span>ใช้จ่าย<b class="num">${f(m.sp)}</b></span><span>จ่ายหนี้<b class="num">${f(m.dp)}</b></span><span>ออม<b class="num">${f(m.sv)}</b></span></div>${hh?`<p class="sub">เหลือ ${f(hh.left)} ฿ · หนี้ตอนปิด ${f(hh.debt)} ฿</p>`:""}</div>`}).join("")+`</section>`;
 return h}
function sets(){
 var fxT=S.fixed.reduce(function(a,x){return a+x.amt},0);
 var inc=fld("เงินเดือน",`<input type="number" inputmode="decimal" value="${S.salary}" onchange="setNum('salary',this.value)">`)+fld("OT ประมาณ (ถ้าบันทึกรายรับจริง ให้ใส่ 0)",`<input type="number" inputmode="decimal" value="${S.ot}" onchange="setNum('ot',this.value)">`);
 var fixed=S.groups.map(function(g){return`<div class="grp"><div class="gh"><input aria-label="ชื่อหมวด" value="${esc(g.name)}" onchange="setG(${g.id},this.value)"><span class="num">${f(gsum(g.id))}</span></div>`+S.fixed.filter(function(x){return x.g==g.id}).map(function(x){return`<div class="fxr"><input aria-label="ชื่อรายการ" value="${esc(x.name)}" onchange="setF(${x.id},'name',this.value)"><input aria-label="จำนวนเงิน" type="number" inputmode="decimal" value="${x.amt}" onchange="setF(${x.id},'amt',this.value)"><button class="ib" aria-label="ลบรายการ" onclick="delF(${x.id})">${ic("trash",18)}</button>${S.groups.length>1?`<select aria-label="ย้ายหมวด" onchange="setF(${x.id},'g',this.value)">${S.groups.map(function(o){return`<option value="${o.id}"${o.id==g.id?" selected":""}>หมวด: ${esc(o.name)}</option>`}).join("")}</select>`:""}</div>`}).join("")+`<div class="row2"><button class="btn s sm" onclick="addF(${g.id})">+ เพิ่มรายการ</button><button class="btn t sm" onclick="delG(${g.id})">ลบหมวด</button></div></div>`}).join("")+`<button class="btn s" onclick="addG()">+ เพิ่มหมวดใหม่</button>`;
 var dts=S.debts.map(function(d){return`<div class="grp"><div class="gh"><input aria-label="ชื่อบัญชี" value="${esc(d.name)}" onchange="setDebt(${d.id},'name',this.value)"><button class="ib" aria-label="ลบบัญชี" onclick="delDebt(${d.id})">${ic("trash",18)}</button></div><div class="g3">${[["bal","คงเหลือ"],["min","ขั้นต่ำ/เดือน"],["apr","ดอก %/ปี"]].map(function(k){return fld(k[1],`<input type="number" inputmode="decimal" value="${d[k[0]]||0}" onchange="setDebt(${d.id},'${k[0]}',this.value)">`)}).join("")}</div></div>`}).join("")+`<p class="sub">ถ้าไม่ทราบดอกเบี้ย ใช้ 16 หรือใส่ 0 สำหรับผ่อนสินค้า</p><button class="btn s" onclick="addDebt()">+ เพิ่มบัตร/หนี้</button>`;
 var scanB=`<p class="sub">เลือกวิธีอ่านสลิป</p><div class="seg" role="group" aria-label="วิธีอ่านสลิป" style="margin:12px 0"><button class="${S.ocrOnly?"on":""}" onclick="setOcr(1)">OCR ในเครื่อง (ไม่ใช้ AI)</button><button class="${S.ocrOnly?"":"on"}" onclick="setOcr(0)">ใช้ Claude</button></div><p class="sub">OCR ในเครื่อง = อ่านด้วยโค้ดและกฎ ฟรี รูปไม่ถูกส่งไปที่ AI ใดๆ จับจำนวนเงิน วันที่ เวลา ผู้รับ บันทึกช่วยจำ และเดาหมวดให้ ยิ่งแก้หมวดให้ถูก แอปยิ่งจำร้านนั้นได้ (ตอนนี้จำไว้ ${Object.keys(S.rules||{}).length} รายการ)</p>`+(Object.keys(S.rules||{}).length?`<button class="btn s sm" style="margin:12px 0" onclick="clearRules()">ลืมที่จำไว้</button>`:"")+(!S.ocrOnly&&!getKey()?`<p class="sub">ต้องใส่ API key ด้านล่างก่อน ไม่งั้นจะใช้ OCR ในเครื่องแทน</p>`:"")+fld("Claude API key (ไม่บังคับ)",`<input type="password" placeholder="sk-ant-... (ไม่บังคับ)" value="${esc(getKey())}" onchange="saveKey(this.value)">`);
 var bk=`<p class="sub">ข้อมูลเก็บในเครื่องนี้เท่านั้น ควรสำรองเป็นระยะ</p><div class="row2"><button class="btn s sm" onclick="backup()">ดาวน์โหลดสำรอง</button><button class="btn s sm" onclick="document.getElementById('rf').click()">กู้ข้อมูล</button></div><input type="file" id="rf" accept=".json" hidden onchange="restore(this.files[0])">`;
 var cbT=0;CATS.forEach(function(c){cbT+=(S.cb||{})[c]||0});
 var cbB=`<p class="sub">ตั้งงบต่อเดือนของแต่ละหมวด ใส่ 0 = ไม่จำกัด แอปจะเตือนเมื่อใช้ถึง 80%</p><div class="g2" style="margin-top:12px">${CATS.map(function(c){return fld(c,`<input type="number" inputmode="decimal" placeholder="0" value="${(S.cb||{})[c]||""}" onchange="setCb('${c}',this.value)">`)}).join("")}</div>`;
 var B={inc:inc,fixed:fixed,debts:dts,cb:cbB,quick:quickSet(),sheet:shCard(),scan:scanB,bk:bk};
 if(sub&&B[sub])return`<section class="card span2">${B[sub]}</section>`;
 var row=function(id,icn,t,sm){return`<button class="mi" onclick="setSub('${id}')"><span class="mic">${ic(icn,20)}</span><span class="ml"><b>${t}</b>${sm?`<small>${sm}</small>`:""}</span>${ic("chev",18)}</button>`},cur=S.theme||"auto";
 var h=`<section class="card span2"><h2>โหมดการแสดงผล</h2><div class="seg3" role="group" aria-label="โหมดการแสดงผล">${[["auto","อัตโนมัติ","auto"],["light","สว่าง","sun"],["dark","มืด","moon"]].map(function(x){return`<button class="${cur==x[0]?"on":""}" onclick="setTheme('${x[0]}')">${ic(x[2],18)}${x[1]}</button>`}).join("")}</div></section>`;
 h+=`<div><h2 class="gt">ข้อมูลการเงิน</h2><div class="menu">`+row("inc","wallet","รายได้",`เงินเดือน ${f(S.salary)} ฿`)+row("fixed","home","ค่าห้องและรายจ่ายประจำ",`รวม ${f(fxT)} ฿ ต่อเดือน`)+row("debts","card","บัตรและหนี้",`${S.debts.length} บัญชี`)+row("cb","tag","งบแยกหมวด",cbT>0?`รวม ${f(cbT)} ฿ ต่อเดือน`:"ยังไม่ตั้ง")+`</div></div>`;
 h+=`<div><h2 class="gt">ตัวช่วยบันทึก</h2><div class="menu">`+row("quick","bolt","ปุ่มลัด",`${S.quick.length} ปุ่ม`)+row("scan","camera","สแกนสลิป",useAI()?"ใช้ Claude":"OCR ในเครื่อง (ไม่ใช้ AI)")+`</div></div>`;
 h+=`<div><h2 class="gt">ข้อมูล</h2><div class="menu">`+row("sheet","cloud","ซิงก์ Google Sheet",esc(S.shMsg||"ยังไม่ได้เชื่อมต่อ"))+row("bk","download","สำรองและกู้ข้อมูล","")+`</div></div>`;
 return h}
function render(){
 var c=calc();
 document.getElementById("hd").innerHTML=header();
 document.getElementById("app").innerHTML=tab=="home"?home():tab=="plan"?plan():tab=="stat"?stat():tab=="log"?log():tab=="debt"?debts():sets();
 document.getElementById("sheet").innerHTML=sheet?sheetHTML(c):"";
 var T=[["home","home","ภาพรวม"],["plan","plan","แผน"],["log","plus","บันทึก"],["debt","card","หนี้"],["stat","chart","สถิติ"],["set","gear","ตั้งค่า"]];
 document.getElementById("tabs").innerHTML=`<div class="ti">`+T.map(function(t){return`<button class="${t[0]==tab?"on":""}" onclick="setTab('${t[0]}')"${t[0]==tab?' aria-current="page"':""}>${ic(t[1],22)}<span>${t[2]}</span></button>`}).join("")+`</div>`}
document.addEventListener("keydown",function(e){if(e.key=="Escape"&&sheet)closeSheet()});
applyTheme();
setTimeout(function(){booting=false;if(S.sh&&S.sh.url){flush();syncPull()}},300);
document.addEventListener("visibilitychange",function(){if(!document.hidden){flush();syncPull()}else if(S.dirty)syncPush()});
window.addEventListener("online",function(){flush();syncPush();syncPull()});
setInterval(function(){if(!document.hidden&&S.sh&&S.sh.url&&!S.dirty)syncPull()},90000);

render();


</script>
</body>
