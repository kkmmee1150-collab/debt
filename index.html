<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b6b57">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>ปิดหนี้</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1f23;--mu:#5d646d;--bd:#e6e3dc;--soft:#f1efea;--pri:#0b6b57;--pri2:#86bfae;--pt:#e2f0eb;--acc:#c2410c;--at:#fcece4;--g1:#cdd1d5;--g2:#939ba3;--on:#fff;--onacc:#fff;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#111312;--card:#1a1d1b;--tx:#ecebe6;--mu:#a4aab1;--bd:#2b2f2d;--soft:#222624;--pri:#4cc2a1;--pri2:#2f7d69;--pt:#173a31;--acc:#ff9466;--at:#3a2219;--g1:#444a4f;--g2:#79828a;--on:#08201a;--onacc:#2a1006;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.7 "Sarabun","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif;word-break:normal;overflow-wrap:break-word;line-break:strict;padding-top:env(safe-area-inset-top,0px)}
h1{font-size:24px;line-height:1.35;font-weight:700;text-wrap:balance}
h2{font-size:15px;font-weight:600;color:var(--mu);margin-bottom:12px;text-wrap:balance}
h3{font-size:18px;font-weight:700;text-wrap:balance}
p,small{text-wrap:pretty}
.sub{color:var(--mu);font-size:14px;line-height:1.6}
b{font-weight:600}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.wrap{max-width:600px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 20px 16px}
.tr{display:flex;align-items:center;gap:8px}
.sync{font-size:13px;color:var(--acc)}
.page{display:grid;gap:16px;padding:0 20px calc(112px + env(safe-area-inset-bottom,0px));grid-template-columns:minmax(0,1fr)}
.card,.note{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;min-width:0}
.note{background:var(--at);border-color:transparent}
.note p{margin:4px 0 14px}
.note .row2{margin-top:0}
.bchip{background:var(--pt);color:var(--pri);border-radius:14px;padding:12px 16px;font-size:15px}.bchip.over{background:var(--at);color:var(--acc)}
.card.dim{opacity:.65}
.card.pend{border:2px solid var(--pri)}
.hero{background:var(--pri);color:var(--on);border-radius:20px;padding:24px;cursor:pointer}
.hero.neg{background:var(--acc);color:var(--onacc)}
.hero p{font-size:14px;opacity:.92}
.hero .big{font-size:44px;font-weight:700;line-height:1.25;margin:2px 0 4px}
.hero .link{display:block;background:none;border:0;color:inherit;font:inherit;font-size:14px;text-decoration:underline;opacity:.9;margin-top:8px;min-height:44px;padding:0;cursor:pointer}
.hero .btn{background:var(--on);color:var(--pri);margin-top:20px}
.hero .btn:disabled{opacity:.7}
.big2{font-size:32px;font-weight:700;line-height:1.3}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:0 20px;border:1px solid transparent;border-radius:12px;background:var(--pri);color:var(--on);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.s{background:transparent;color:var(--tx);border-color:var(--bd)}
.btn.t{background:none;color:var(--acc);width:auto}
.btn.sm{min-height:44px;padding:0 16px;font-size:15px;width:auto}
.btn:disabled{opacity:.45;cursor:default}
.btn:active:not(:disabled){transform:scale(.98)}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:12px;background:none;color:var(--mu);cursor:pointer;flex:none}
.ib.sm{width:36px;height:36px}.ib.on{background:var(--soft);color:var(--tx)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.row2{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px;align-items:center}
.row2 .btn{flex:1 1 140px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.li{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--bd)}
.li:last-child{border:0}
.li.tap{cursor:pointer}
.li .l{min-width:0;flex:1}.li .l small{display:block;font-size:13.5px;color:var(--mu);font-weight:400}
.li .v{display:flex;align-items:center;gap:2px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}
.li.tot{border-top:2px solid var(--bd);border-bottom:0;margin-top:4px;font-weight:700;font-size:17px}
.cat{cursor:pointer}
.bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:8px}.bar.a i{background:var(--acc)}
.fld{display:block;margin-bottom:16px}
.lb{display:block;font-size:13.5px;color:var(--mu);margin-bottom:6px}
input,select,textarea{width:100%;min-height:48px;padding:10px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit}
textarea{margin:12px 0}
input.amt{font-size:28px;font-weight:700;min-height:60px}
input.err{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.em{display:block;color:var(--acc);font-size:13.5px;min-height:0;margin-top:4px}.em:empty{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.card>.chips:last-child{margin-bottom:0}
.chip{min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--on)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px}
.seg button{min-height:42px;border:0;background:none;border-radius:9px;font:inherit;color:var(--mu);cursor:pointer}
.seg button.on{background:var(--card);color:var(--tx);font-weight:600;box-shadow:0 0 0 1px var(--bd)}
.rk{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;margin-right:10px;border-radius:50%;background:var(--soft);color:var(--mu);font-size:13px;font-weight:600}
.rk.on{background:var(--pri);color:var(--on)}
.tag{font-size:13px;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--mu)}.tag.ok{background:var(--pt);color:var(--pri)}
.empty{display:grid;gap:4px;text-align:center;padding:20px 8px;color:var(--mu);font-size:14px}.empty b{color:var(--tx);font-size:16px}
.busy{display:flex;gap:16px;align-items:center}
.spin{width:22px;height:22px;border:3px solid var(--g1);border-top-color:var(--pri);border-radius:50%;animation:s .8s linear infinite;flex:none}
@keyframes s{to{transform:rotate(360deg)}}
.more{margin-top:16px;border-top:1px solid var(--bd);padding-top:4px}
.more summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--mu);font-size:14px}
.dt summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;min-height:44px}
.dt summary::-webkit-details-marker,.more summary::-webkit-details-marker{display:none}
.dt summary small{display:block;color:var(--mu);font-size:13.5px;font-weight:400}
.dt[open] summary .ic{transform:rotate(90deg)}.dt summary .ic{color:var(--mu);flex:none}
.db{padding-top:16px}
.grp{padding:16px 0;border-top:1px solid var(--bd)}.grp:first-child{border-top:0;padding-top:0}
.gh{display:flex;align-items:center;gap:12px;margin-bottom:12px}.gh input{font-weight:600}
.fxr{display:grid;grid-template-columns:1fr 104px 44px;gap:8px;margin-bottom:12px}
.fxr select{grid-column:1/-1;min-height:40px;font-size:14px;color:var(--mu)}
.st{display:grid;gap:2px}.st span{font-size:13.5px;color:var(--mu)}.st b{font-size:24px;line-height:1.3}.st small{font-size:13px;color:var(--mu)}
.stg{gap:20px 12px}
.mr{padding:16px 0;border-bottom:1px solid var(--bd)}.mr:last-child{border:0}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 4px}.g4 span{font-size:12.5px;color:var(--mu);display:grid}.g4 b{font-size:15px;color:var(--tx)}
.res{margin-top:4px}.res p{margin-top:6px}
.lg{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:8px}
.lg i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-left:8px}.lg i:first-child{margin-left:0}
svg:not(.ic){display:block;width:100%;height:auto}
svg text{font-size:11px;fill:var(--mu)}svg text.sv{fill:var(--tx);font-weight:600}svg .ax{stroke:var(--bd)}
.ic{flex:none;display:inline-block;vertical-align:middle}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.ti{display:flex;max-width:600px;margin:0 auto}
.tabs button{flex:1;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:0;color:var(--mu);font:inherit;font-size:12px;cursor:pointer}
.tabs button.on{color:var(--pri);font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--card);width:100%;max-width:560px;max-height:86vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.sh .btn{margin-top:16px}.sh .fld:last-of-type{margin-bottom:8px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sh.cele{text-align:center}.sh.cele h3{font-size:22px;margin:8px 0}.sh.cele .sub{font-size:15px}
.bounce{font-size:64px;line-height:1.2;animation:bn 1s ease infinite}@keyframes bn{50%{transform:scale(1.15) rotate(6deg)}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);display:flex;align-items:center;gap:16px;max-width:calc(100% - 32px);background:#23262a;color:#fff;padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;font-size:15px}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:#8fe0c3;font:inherit;font-weight:600;cursor:pointer;min-height:36px;padding:0 4px}
@media(min-width:900px){
 .wrap{max-width:980px;padding-top:56px}
 .page{grid-template-columns:repeat(2,minmax(0,1fr));padding-bottom:48px;align-items:start}
 .span2{grid-column:1/-1}
 .tabs{top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--bd)}
 .ti{max-width:980px;gap:8px}
 .tabs button{flex:0 0 auto;flex-direction:row;gap:8px;min-height:56px;padding:0 20px;font-size:15px}
 .ov{align-items:center}.sh{border-radius:20px;max-height:80vh}
 .toast{bottom:32px}
 .btn{width:auto;min-width:200px}.btn.span2{justify-self:start}
 .row2 .btn,.card>.btn,.hero .btn{width:auto}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div class="wrap"><header class="top" id="hd"></header><main id="app" class="page"></main></div>
<nav class="tabs" id="tabs" aria-label="เมนูหลัก"></nav>
<div id="sheet"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept="image/*" hidden>
<script>


var KEY="debtapp1";
var CATS=["อาหาร","เดินทาง","ค่าน้ำไฟ","ของใช้","อื่นๆ"];


var def={v:2,salary:16390,ot:0,groups:[{id:1,name:"ค่าห้อง"},{id:2,name:"ค่าใช้จ่ายประจำ"}],
fixed:[{id:11,g:1,name:"ห้อง",amt:5000},{id:12,g:1,name:"ส่วนกลาง",amt:0},{id:13,g:1,name:"ไฟฟ้า",amt:0},{id:14,g:1,name:"น้ำ",amt:0},{id:15,g:1,name:"เน็ตห้อง",amt:0},{id:16,g:2,name:"โทนสับ2",amt:0},{id:17,g:2,name:"เน็ตโทรสับ",amt:0},{id:18,g:2,name:"จัดฟัน",amt:0}],
debts:[{id:1,name:"KTC",bal:26185,min:810},{id:2,name:"AEON",bal:6211,min:600},{id:3,name:"Umay",bal:21493,min:650},{id:4,name:"UCHOOSE",bal:23482.91,min:2500},{id:5,name:"This shop",bal:14619,min:2346},{id:6,name:"UFUND",bal:0,min:0}],tx:[]};
function cp(o){return JSON.parse(JSON.stringify(o))}
var S;try{S=JSON.parse(localStorage.getItem(KEY))||cp(def)}catch(e){S=cp(def)}
if(S.v!=2){var oldRent=S.rent||0,d2=cp(def);S.v=2;S.groups=d2.groups;S.fixed=d2.fixed;S.fixed[0].amt=oldRent;delete S.rent;if(!S.debts.some(function(x){return x.name.toLowerCase()=="ufund"}))S.debts.push({id:Date.now(),name:"UFUND",bal:0,min:0});save()}
if(!S.plan)S.plan={living:3500,save:500,strat:"apr"};S.debts.forEach(function(d){if(d.apr==null)d.apr=/this shop/i.test(d.name)?0:16});
if(!S.sh)S.sh={url:"",token:""};if(!S.q)S.q=[];if(!S.bud)S.bud={amt:null,at:0,pay:0};if(!S.seen)S.seen={};if(!S.hist)S.hist={};if(!S.carry)S.carry={};if(!S.quick)S.quick=[{id:1,name:"ข้าว",amt:60,cat:"อาหาร"},{id:2,name:"ค่ารถ",amt:40,cat:"เดินทาง"},{id:3,name:"น้ำ/ขนม",amt:30,cat:"อาหาร"}];
var tab="home",cat="อาหาร",pend=null,busy=false,msg="",sheet=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){return iso(new Date())}
function mk(){return today().slice(0,7)}
function f(n){return Math.round(n).toLocaleString("th-TH")}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function gcol(id){var i=S.groups.findIndex(function(g){return g.id==id});return GC[(i<0?0:i)%GC.length]}
function gsum(id){return S.fixed.filter(function(x){return x.g==id}).reduce(function(a,x){return a+x.amt},0)}
function monthTx(k){k=k||mk();return S.tx.filter(function(t){return t.date.slice(0,7)==k})}
function paid(id,k){return monthTx(k).filter(function(t){return t.debt==id}).reduce(function(a,t){return a+t.amt},0)}
function calc(k,incO){
 k=k||mk();var cur=k==mk(),carry=(S.carry&&S.carry[k])||0,inc=(incO!=null?incO:S.salary+S.ot)+carry,commit=0,spent=0,by={},fx=S.fixed.reduce(function(a,x){return a+x.amt},0);
 S.debts.forEach(function(d){var p=paid(d.id,k);if(cur){if(d.bal>0||p>0)commit+=Math.max(d.min,p)}else commit+=p});
 monthTx(k).forEach(function(t){if(!t.debt){spent+=t.amt;by[t.cat]=(by[t.cat]||0)+t.amt}});
 var left=inc-fx-commit-spent,now=new Date(),dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),days=Math.max(1,dim-now.getDate()+1);
 return{inc:inc,carry:carry,fx:fx,commit:commit,spent:spent,left:left,perDay:left/days,days:days,dim:dim,by:by}}
function guess(n){if(/ข้าว|กิน|น้ำ|กาแฟ|อาหาร|ขนม|เซเว่น/.test(n))return"อาหาร";if(/รถ|bts|mrt|แท็กซี่|วิน|เดินทาง|น้ำมัน|grab/i.test(n))return"เดินทาง";if(/ไฟ|ประปา|เน็ต|โทรศัพท์|เติมเงิน/.test(n))return"ค่าน้ำไฟ";return"อื่นๆ"}

/* ---- transactions ---- */

function pay(id,def){var d=S.debts.filter(function(x){return x.id==id})[0];var a=parseFloat(prompt("จ่าย "+d.name+" กี่บาท?",def!=null?Math.round(def):d.min));if(a>0)addTx(a,"","",null,id)}

function editTx(id){var t=S.tx.filter(function(x){return x.id==id})[0];if(!t)return;var a=parseFloat(prompt("แก้จำนวนเงิน",t.amt));if(isNaN(a)||a<0)return;if(t.debt){var d=S.debts.filter(function(x){return x.id==t.debt})[0];if(d)d.bal=Math.max(0,d.bal+t.amt-a)}t.amt=a;qAdd({a:"upsert",id:String(t.id),row:txRowData(t)});if(t.debt)syncDebts();save();render()}


function setTab(t){sheet=null;tab=t;render();window.scrollTo(0,0)}

function setNum(k,v){S[k]=parseFloat(v)||0;save();render()}

/* ---- editors: fixed items, groups, debts ---- */
function setF(id,k,v){var x=S.fixed.filter(function(y){return y.id==id})[0];x[k]=k=="amt"?(parseFloat(v)||0):k=="g"?+v:v;save();render()}
function delF(id){S.fixed=S.fixed.filter(function(y){return y.id!=id});save();render()}
function addF(g){S.fixed.push({id:Date.now(),g:g,name:"รายการใหม่",amt:0});save();render()}
function setG(id,v){S.groups.filter(function(g){return g.id==id})[0].name=v;save();render()}
function addG(){S.groups.push({id:Date.now(),name:"หมวดใหม่"});save();render()}
function delG(id){if(S.groups.length<2){alert("ต้องเหลืออย่างน้อย 1 หมวด");return}var o=S.groups.filter(function(g){return g.id!=id})[0].id;if(!confirm("ลบหมวดนี้? รายการข้างในจะย้ายไปหมวดอื่น"))return;S.fixed.forEach(function(x){if(x.g==id)x.g=o});S.groups=S.groups.filter(function(g){return g.id!=id});save();render()}
function setDebt(id,k,v){var d=S.debts.filter(function(x){return x.id==id})[0];d[k]=k=="name"?v:(parseFloat(v)||0);syncDebts();save();render()}
function addDebt(){S.debts.push({id:Date.now(),name:"บัตร/หนี้ใหม่",bal:0,min:0,apr:16});syncDebts();save();render()}
function delDebt(id){if(!confirm("ลบหนี้นี้และประวัติการจ่ายของมัน?"))return;S.debts=S.debts.filter(function(x){return x.id!=id});S.tx=S.tx.filter(function(t){return t.debt!=id});save();render()}

/* ---- sheet (card details) ---- */
function openSheet(t,a){sheet={t:t,a:a};render()}
function closeSheet(){sheet=null;render()}
function goTab(t){setTab(t)}


function sortTx(a){return a.sort(function(x,y){return y.date<x.date?-1:y.date>x.date?1:y.id-x.id})}


/* ---- charts ---- */




/* ---- payoff plan ---- */
function setPlan(k,v){S.plan[k]=k=="strat"?v:(parseFloat(v)||0);save();render()}
function prio(ds,strat){return ds.slice().sort(function(a,b){var za=a.apr<=0?1:0,zb=b.apr<=0?1:0;if(za!=zb)return za-zb;if(strat=="bal")return a.bal-b.bal;return b.apr-a.apr||a.bal-b.bal})}
function simulate(strat,pool,roll,shock){
 var ds=S.debts.filter(function(d){return d.bal>0}).map(function(d){return{id:d.id,bal:d.bal,min:d.min,apr:d.apr||0}});
 var order=prio(ds,strat),minsAll=ds.reduce(function(a,d){return a+d.min},0),budget=minsAll+Math.max(0,pool),interest=0,tot=function(){return ds.reduce(function(a,d){return a+d.bal},0)},series=[tot()],m=0,exact=0;
 while(m<240&&ds.some(function(d){return d.bal>0.5})){
  m++;ds.forEach(function(d){if(d.bal>0){var i=d.bal*d.apr/1200;d.bal+=i;interest+=i}});
  var bg=(m==1&&shock)?Math.max(minsAll,budget-shock):budget,left=bg;
  order.forEach(function(d){if(d.bal>0){var p=Math.min(d.bal,d.min);d.bal-=p;left-=p}});
  if(roll)order.forEach(function(d){if(d.bal>0&&left>0){var p=Math.min(d.bal,left);d.bal-=p;left-=p}});
  ds.forEach(function(d){if(d.bal<=0.5)d.bal=0});
  if(!ds.some(function(d){return d.bal>0}))exact=(m-1)+(bg-left)/bg;
  series.push(tot())}
 return{months:m,exact:exact||m,done:!ds.some(function(d){return d.bal>0.5}),interest:interest,series:series}}

/* ---- daily budget ---- */
function daysLeft(){var n=new Date(),p=(S.bud&&S.bud.pay)||0;
 if(p>=1&&p<=28){var t=new Date(n.getFullYear(),n.getMonth(),n.getDate()),nx=new Date(n.getFullYear(),n.getMonth(),p);if(nx<=t)nx=new Date(n.getFullYear(),n.getMonth()+1,p);return Math.max(1,Math.round((nx-t)/864e5))}
 var dim=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();return Math.max(1,dim-n.getDate()+1)}
function budInfo(){var B=S.bud;if(!B||B.amt==null)return null;var sp=0,st=0,td=today();
 S.tx.forEach(function(t){if(!t.debt&&t.cat!="เงินออม"&&t.id>=B.at){sp+=t.amt;if(t.date==td)st+=t.amt}});
 var rem=B.amt-sp,d=daysLeft(),per=(rem+st)/d;return{rem:rem,days:d,per:per,spentToday:st,todayLeft:per-st,pay:B.pay}}
function saveBud(){var a=parseFloat(document.getElementById("bud-amt").value);if(isNaN(a)){fieldErr("bud-amt","ใส่จำนวนเงินก่อน");return}var p=parseInt(document.getElementById("bud-pay").value)||0;if(p<0||p>28)p=0;S.bud={amt:a,at:Date.now(),pay:p};save();sheet=null;render();var b=budInfo();toast(`ตั้งงบแล้ว ใช้ได้วันละ ${f(Math.max(0,b.per))} ฿`)}

 if(t=="debt"){ti="หนี้และบัตร";b=S.debts.map(function(d){var p=paid(d.id);return li(esc(d.name),f(d.bal)+" ฿",{c:"var(--acc)",sub:`ขั้นต่ำ ${f(d.min)} · จ่ายแล้ว ${f(p)}${p>=d.min&&d.min>0?" ✓":""}`})}).join("")+`<button class="btn" onclick="goTab('debt')">ไปหน้าจ่ายหนี้</button>`}

/* ---- charts ---- */
function waterfall(c){
 var r1=c.inc-c.fx,r2=r1-c.commit,r3=r2-c.spent;
 var it=[["รายได้",0,c.inc,"var(--pri)",c.inc],["ประจำ",r1,c.inc,"var(--g2)",c.fx],["หนี้",r2,r1,"var(--acc)",c.commit],["ใช้จ่าย",r3,r2,"var(--g1)",c.spent],["เหลือ",Math.min(0,c.left),Math.max(0,c.left),c.left<0?"var(--acc)":"var(--pri2)",c.left]];
 var mx=Math.max(c.inc,1),mn=Math.min(0,c.left,r3),rng=(mx-mn)||1,y=function(v){return 24+(mx-v)/rng*108},s="";
 it.forEach(function(o,i){var lo=Math.min(o[1],o[2]),hi=Math.max(o[1],o[2]);if(i==0){lo=0;hi=c.inc}var x=12+i*61,top=y(hi),h=Math.max(2,y(lo)-top);
  s+=`<rect x="${x}" y="${top}" width="44" height="${h}" rx="6" style="fill:${o[3]}"/><text x="${x+22}" y="${top-6}" text-anchor="middle" class="sv">${(i&&i<4?"−":"")+f(o[4])}</text><text x="${x+22}" y="162" text-anchor="middle">${o[0]}</text>`});
 return`<svg viewBox="0 0 320 170" role="img" aria-label="กราฟเงินไหลของเดือนนี้"><line x1="6" x2="314" y1="${y(0)}" y2="${y(0)}" class="ax"/>${s}</svg>`}
function daily(c){
 var B=c.inc-c.fx-c.commit,now=new Date().getDate(),cum=0,per={};
 monthTx().forEach(function(t){if(!t.debt){var d=+t.date.slice(8);per[d]=(per[d]||0)+t.amt}});
 var vals=[B];for(var d=1;d<=now;d++){cum+=per[d]||0;vals.push(B-cum)}
 var mx=Math.max(B,1),mn=Math.min(0,Math.min.apply(null,vals)),rng=(mx-mn)||1,W=286,H=100;
 var X=function(d){return 22+d/c.dim*W},Y=function(v){return 18+(mx-v)/rng*H};
 var p=vals.map(function(v,i){return(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)}).join(" "),last=vals[vals.length-1],col=last<0?"var(--acc)":"var(--pri)";
 return`<svg viewBox="0 0 320 150" role="img" aria-label="เงินคงเหลือรายวัน"><line x1="22" x2="308" y1="${Y(0)}" y2="${Y(0)}" style="stroke:var(--acc);opacity:.5" stroke-dasharray="3 3"/><line x1="${X(0)}" y1="${Y(B)}" x2="${X(c.dim)}" y2="${Y(0)}" style="stroke:var(--g2)" stroke-dasharray="4 4"/><path d="${p}" fill="none" style="stroke:${col}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${X(vals.length-1)}" cy="${Y(last)}" r="5" style="fill:${col}"/><text x="22" y="12" class="sv">เหลือ ${f(last)}</text><text x="22" y="144">วันที่ 1</text><text x="308" y="144" text-anchor="end">วันที่ ${c.dim}</text></svg>`}
function lineChart(a,b,H){
 var pad=function(x){var r=x.slice(0,H+1);while(r.length<H+1)r.push(x[x.length-1]);return r},A=pad(a),B=pad(b),mx=Math.max(B[0],1),W=286,h=100;
 var X=function(i){return 22+i/H*W},Y=function(v){return 16+(mx-v)/mx*h};
 var path=function(x){return x.map(function(v,i){return(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)}).join(" ")};
 return`<svg viewBox="0 0 320 150" role="img" aria-label="หนี้รวมตามแผนเทียบจ่ายขั้นต่ำ"><path d="${path(B)}" fill="none" style="stroke:var(--g2)" stroke-width="2.5" stroke-dasharray="5 4"/><path d="${path(A)}" fill="none" style="stroke:var(--pri)" stroke-width="3.5" stroke-linecap="round"/><text x="22" y="10" class="sv">หนี้รวม ${f(mx)}</text><text x="22" y="144">ตอนนี้</text><text x="308" y="144" text-anchor="end">อีก ${H} เดือน</text></svg><p class="sub lg"><i style="background:var(--pri)"></i>ตามแผน<i style="background:var(--g2)"></i>จ่ายขั้นต่ำอย่างเดียว</p>`}
function barChart(ms,mx){var s="";
 ms.forEach(function(m,i){var x0=14+i*50;
  [[m.inc,"var(--pri)"],[m.sp,"var(--g2)"],[m.dp,"var(--acc)"],[m.sv,"var(--pri2)"]].forEach(function(v,j){var h=Math.max(0,v[0]/mx*110);s+=`<rect x="${x0+j*10}" y="${135-h}" width="8" height="${h}" rx="2" style="fill:${v[1]};opacity:${m.est&&j==0?.45:1}"/>`});
  s+=`<text x="${x0+20}" y="152" text-anchor="middle">${TM[+m.k.slice(5)-1]}</text>`});
 return`<svg viewBox="0 0 320 160" role="img" aria-label="กราฟรายเดือน"><line x1="8" x2="312" y1="135" y2="135" class="ax"/>${s}</svg><p class="sub lg"><i style="background:var(--pri)"></i>รายได้<i style="background:var(--g2)"></i>ใช้จ่าย<i style="background:var(--acc)"></i>จ่ายหนี้<i style="background:var(--pri2)"></i>ออม</p>`}

  var pl=simulate(P.strat,pool,true),bs=simulate(P.strat,0,false),H=Math.min(60,Math.max(12,pl.months+3));

  h+=`<section class="card"><h2>ลำดับปิดหนี้</h2><div class="seg" role="group" aria-label="เลือกลำดับ"><button class="${P.strat=="apr"?"on":""}" onclick="setPlan('strat','apr')">ดอกสูงก่อน</button><button class="${P.strat=="bal"?"on":""}" onclick="setPlan('strat','bal')">ยอดน้อยก่อน</button></div><p class="sub" style="margin:8px 0 4px">${P.strat=="apr"?"เสียดอกรวมน้อยที่สุด":"ปิดบัญชีได้ไว ได้กำลังใจ"}</p>`+order.map(function(d,i){var r=rec[d.id],need=Math.max(0,r-paid(d.id));
   return`<div class="li"><span class="l"><span class="rk${i==0?" on":""}">${i+1}</span><b>${esc(d.name)}</b>${r>=d.bal?" · ปิดได้เดือนนี้":""}<small>เหลือ ${f(d.bal)} · ดอก ${d.apr}%/ปี${d.apr<=0?" · ผ่อน 0% ไม่ต้องรีบโปะ":""}</small><small>แนะนำจ่าย <b>${f(r)}</b> ฿</small></span><span class="v"><button class="btn s sm" onclick="pay(${d.id},${Math.round(need)})"${need<=0?" disabled":""}>${need<=0?"จ่ายแล้ว":"จ่าย "+f(need)}</button></span></div>`}).join("")+`</section>`}

 var dts=S.debts.map(function(d){return`<div class="grp"><div class="gh"><input aria-label="ชื่อบัญชี" value="${esc(d.name)}" onchange="setDebt(${d.id},'name',this.value)"><button class="ib" aria-label="ลบบัญชี" onclick="delDebt(${d.id})">${ic("trash",18)}</button></div><div class="g3">${[["bal","คงเหลือ"],["min","ขั้นต่ำ/เดือน"],["apr","ดอก %/ปี"]].map(function(k){return fld(k[1],`<input type="number" inputmode="decimal" value="${d[k[0]]||0}" onchange="setDebt(${d.id},'${k[0]}',this.value)">`)}).join("")}</div></div>`}).join("")+`<p class="sub">ถ้าไม่ทราบดอกเบี้ย ใช้ 16 หรือใส่ 0 สำหรับผ่อนสินค้า</p><button class="btn s" onclick="addDebt()">+ เพิ่มบัตร/หนี้</button>`;
 var scanB=`<p class="sub">ไม่ใส่คีย์ = ใช้ OCR ฟรีในเครื่อง (แม่นปานกลาง) ใส่ Claude API key = แม่นกว่า ค่าใช้จ่ายน้อยมากต่อรูป คีย์เก็บในเครื่องนี้เท่านั้น</p>`+fld("Claude API key",`<input type="password" placeholder="sk-ant-... (ไม่บังคับ)" value="${esc(getKey())}" onchange="saveKey(this.value)">`);
 var bk=`<p class="sub">ข้อมูลเก็บในเครื่องนี้เท่านั้น ควรสำรองเป็นระยะ</p><div class="row2"><button class="btn s sm" onclick="backup()">ดาวน์โหลดสำรอง</button><button class="btn s sm" onclick="document.getElementById('rf').click()">กู้ข้อมูล</button></div><input type="file" id="rf" accept=".json" hidden onchange="restore(this.files[0])">`;
 return det("inc","รายได้",`เงินเดือน ${f(S.salary)} · OT ${f(S.ot)}`,inc)+det("fixed","ค่าห้องและรายจ่ายประจำ",`รวม ${f(fxT)} ฿ ต่อเดือน`,fixed)+det("debts","บัตรและหนี้",`${S.debts.length} บัญชี`,dts)+det("quick","ปุ่มลัด",`${S.quick.length} ปุ่ม`,quickSet())+det("sheet","ซิงก์ Google Sheet",esc(S.shMsg||"ยังไม่ได้เชื่อมต่อ"),shCard())+det("scan","สแกนสลิป",getKey()?"ใช้ Claude":"ใช้ OCR ฟรี",scanB)+det("bk","สำรองข้อมูล","",bk)}
function render(){
 var c=calc();
 document.getElementById("hd").innerHTML=header();
 document.getElementById("app").innerHTML=tab=="home"?home():tab=="plan"?plan():tab=="stat"?stat():tab=="log"?log():tab=="debt"?debts():sets();
 document.getElementById("sheet").innerHTML=sheet?sheetHTML(c):"";
 var T=[["home","home","ภาพรวม"],["plan","plan","แผน"],["log","plus","บันทึก"],["debt","card","หนี้"],["stat","chart","สถิติ"]];
 document.getElementById("tabs").innerHTML=`<div class="ti">`+T.map(function(t){return`<button class="${t[0]==tab?"on":""}" onclick="setTab('${t[0]}')"${t[0]==tab?' aria-current="page"':""}>${ic(t[1],22)}<span>${t[2]}</span></button>`}).join("")+`</div>`}
document.addEventListener("keydown",function(e){if(e.key=="Escape"&&sheet)closeSheet()});

render();


</script>
