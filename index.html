<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0d9488"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>ปิดหนี้ + รายรับรายจ่าย</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#18202b;--mu:#6b7686;--bd:#e6e9ef;--inc:#16a34a;--rent:#2563eb;--debt:#e11d48;--exp:#d97706;--left:#0d9488;--sh:0 2px 10px rgba(20,30,50,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1217;--card:#18202a;--tx:#eef1f5;--mu:#93a0b2;--bd:#27313d;--inc:#4ade80;--rent:#60a5fa;--debt:#fb7185;--exp:#fbbf24;--left:#2dd4bf;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1217;--card:#18202a;--tx:#eef1f5;--mu:#93a0b2;--bd:#27313d;--inc:#4ade80;--rent:#60a5fa;--debt:#fb7185;--exp:#fbbf24;--left:#2dd4bf;--sh:none;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Sarabun","Noto Sans Thai",system-ui,sans-serif;max-width:560px;margin:0 auto;padding:14px 14px 96px}
.hero{border-radius:22px;padding:20px;color:#fff;background:linear-gradient(135deg,#0d9488,#2563eb);box-shadow:var(--sh);margin-bottom:14px}
.hero.neg{background:linear-gradient(135deg,#e11d48,#d97706)}
.hero .big{font-size:40px;font-weight:800;line-height:1.1}.hero small{opacity:.85}
.pill{display:inline-block;background:rgba(255,255,255,.2);border-radius:99px;padding:3px 12px;font-size:13px;margin-top:8px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--sh);border:1px solid var(--bd)}
h2{font-size:16px;margin:0 0 10px}.mu{color:var(--mu);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:16px;padding:12px 14px;border:1px solid var(--bd);border-left:5px solid var(--c);box-shadow:var(--sh)}
.kpi b{display:block;font-size:20px;color:var(--c)}.kpi span{font-size:13px;color:var(--mu)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--c)}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--left);color:#fff;cursor:pointer;font-weight:600}
button.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}button.x{background:none;color:var(--mu);padding:4px 8px;font-weight:400}
button.scan{width:100%;padding:16px;font-size:17px;background:linear-gradient(135deg,#7c3aed,#2563eb)}
button:disabled{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.chips button{padding:8px 14px;border-radius:99px;font-weight:500}
.chips button.on{background:var(--c);color:#fff;border-color:var(--c)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--c)}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);max-width:560px;margin:0 auto}
.tabs button{flex:1;background:none;color:var(--mu);border-radius:0;padding:10px 4px;font-size:12px;font-weight:500}.tabs button span{display:block;font-size:22px}.tabs button.on{color:var(--left);font-weight:700}
svg{width:100%;height:auto;display:block}svg text{fill:var(--mu);font-size:10px;font-family:inherit}
.pend{border:2px solid #7c3aed}.sp{animation:s 1s linear infinite;display:inline-block}@keyframes s{to{transform:rotate(360deg)}}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--mu)}

.kpi,.card.k,.hero{cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--card);width:100%;max-width:560px;max-height:84vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.hd h2{margin:0;font-size:18px}
.tabs{z-index:10}
.fx{display:grid;grid-template-columns:1fr 100px 36px;gap:8px;margin-bottom:8px}.fx select{grid-column:1/-1;padding:8px;font-size:14px;color:var(--mu)}
.fx input{padding:10px}.del{color:var(--debt)!important}
.gh{display:flex;gap:8px;align-items:center;margin-bottom:10px}.gh input{font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div class="tabs" id="tabs"></div>
<input type="file" id="file" accept="image/*" hidden>
<script>
var KEY="debtapp1";
var CATS=["อาหาร","เดินทาง","ค่าน้ำไฟ","ของใช้","อื่นๆ"];
var COL={"อาหาร":"#f97316","เดินทาง":"#3b82f6","ค่าน้ำไฟ":"#06b6d4","ของใช้":"#a855f7","อื่นๆ":"#94a3b8","จ่ายหนี้":"#e11d48","เงินออม":"#0d9488"};
var GC=["#2563eb","#a855f7","#0891b2","#ca8a04","#db2777","#65a30d"];
var def={v:2,salary:16390,ot:0,groups:[{id:1,name:"ค่าห้อง"},{id:2,name:"ค่าใช้จ่ายประจำ"}],
fixed:[{id:11,g:1,name:"ห้อง",amt:5000},{id:12,g:1,name:"ส่วนกลาง",amt:0},{id:13,g:1,name:"ไฟฟ้า",amt:0},{id:14,g:1,name:"น้ำ",amt:0},{id:15,g:1,name:"เน็ตห้อง",amt:0},{id:16,g:2,name:"โทนสับ2",amt:0},{id:17,g:2,name:"เน็ตโทรสับ",amt:0},{id:18,g:2,name:"จัดฟัน",amt:0}],
debts:[{id:1,name:"KTC",bal:26185,min:810},{id:2,name:"AEON",bal:6211,min:600},{id:3,name:"Umay",bal:21493,min:650},{id:4,name:"UCHOOSE",bal:23482.91,min:2500},{id:5,name:"This shop",bal:14619,min:2346},{id:6,name:"UFUND",bal:0,min:0}],tx:[]};
function cp(o){return JSON.parse(JSON.stringify(o))}
var S;try{S=JSON.parse(localStorage.getItem(KEY))||cp(def)}catch(e){S=cp(def)}
if(S.v!=2){var oldRent=S.rent||0,d2=cp(def);S.v=2;S.groups=d2.groups;S.fixed=d2.fixed;S.fixed[0].amt=oldRent;delete S.rent;if(!S.debts.some(function(x){return x.name.toLowerCase()=="ufund"}))S.debts.push({id:Date.now(),name:"UFUND",bal:0,min:0});save()}
if(!S.plan)S.plan={living:3500,save:500,strat:"apr"};S.debts.forEach(function(d){if(d.apr==null)d.apr=/this shop/i.test(d.name)?0:16});
var tab="home",cat="อาหาร",pend=null,busy=false,msg="",sheet=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){return iso(new Date())}
function mk(){return today().slice(0,7)}
function f(n){return Math.round(n).toLocaleString("th-TH")}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function gcol(id){var i=S.groups.findIndex(function(g){return g.id==id});return GC[(i<0?0:i)%GC.length]}
function gsum(id){return S.fixed.filter(function(x){return x.g==id}).reduce(function(a,x){return a+x.amt},0)}
function monthTx(){return S.tx.filter(function(t){return t.date.slice(0,7)==mk()})}
function paid(id){return monthTx().filter(function(t){return t.debt==id}).reduce(function(a,t){return a+t.amt},0)}
function calc(){
 var inc=S.salary+S.ot,commit=0,spent=0,by={},fx=S.fixed.reduce(function(a,x){return a+x.amt},0);
 S.debts.forEach(function(d){if(d.bal>0||paid(d.id)>0)commit+=Math.max(d.min,paid(d.id))});
 monthTx().forEach(function(t){if(!t.debt){spent+=t.amt;by[t.cat]=(by[t.cat]||0)+t.amt}});
 var left=inc-fx-commit-spent,now=new Date(),dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),days=Math.max(1,dim-now.getDate()+1);
 return{inc:inc,fx:fx,commit:commit,spent:spent,left:left,perDay:left/days,days:days,dim:dim,by:by}}
function guess(n){if(/ข้าว|กิน|น้ำ|กาแฟ|อาหาร|ขนม|เซเว่น/.test(n))return"อาหาร";if(/รถ|bts|mrt|แท็กซี่|วิน|เดินทาง|น้ำมัน|grab/i.test(n))return"เดินทาง";if(/ไฟ|ประปา|เน็ต|โทรศัพท์|เติมเงิน/.test(n))return"ค่าน้ำไฟ";return"อื่นๆ"}

/* ---- transactions ---- */
function addTx(amt,c,note,date,debt){
 if(!(amt>0))return;
 var t={id:Date.now()+Math.random(),date:date||today(),amt:amt,cat:debt?"จ่ายหนี้":c,note:note||""};
 if(debt){var d=S.debts.filter(function(x){return x.id==debt})[0];if(d){t.debt=debt;d.bal=Math.max(0,d.bal-amt);t.note=d.name}}
 S.tx.unshift(t);save();render()}
function pay(id,def){var d=S.debts.filter(function(x){return x.id==id})[0];var a=parseFloat(prompt("จ่าย "+d.name+" กี่บาท?",def!=null?Math.round(def):d.min));if(a>0)addTx(a,"","",null,id)}
function delTx(id){if(!confirm("ลบรายการนี้? (ถ้าเป็นการจ่ายหนี้ ยอดหนี้จะคืนกลับ)"))return;var t=S.tx.filter(function(x){return x.id==id})[0];if(t&&t.debt){var d=S.debts.filter(function(x){return x.id==t.debt})[0];if(d)d.bal+=t.amt}S.tx=S.tx.filter(function(x){return x.id!=id});save();render()}
function editTx(id){var t=S.tx.filter(function(x){return x.id==id})[0];if(!t)return;var a=parseFloat(prompt("แก้จำนวนเงิน",t.amt));if(isNaN(a)||a<0)return;if(t.debt){var d=S.debts.filter(function(x){return x.id==t.debt})[0];if(d)d.bal=Math.max(0,d.bal+t.amt-a)}t.amt=a;save();render()}
function quick(){addTx(parseFloat(document.getElementById("amt").value),cat,document.getElementById("note").value)}
function bulk(){document.getElementById("bulk").value.split("\n").forEach(function(l){var m=l.match(/(\d[\d,]*\.?\d*)\s*$/);if(!m)return;var a=parseFloat(m[1].replace(/,/g,"")),n=l.replace(m[0],"").trim();if(a>0)S.tx.unshift({id:Date.now()+Math.random(),date:today(),amt:a,cat:guess(n),note:n})});save();render()}
function setTab(t){sheet=null;tab=t;render();window.scrollTo(0,0)}
function setCat(c){cat=c;render()}
function setNum(k,v){S[k]=parseFloat(v)||0;save();render()}

/* ---- editors: fixed items, groups, debts ---- */
function setF(id,k,v){var x=S.fixed.filter(function(y){return y.id==id})[0];x[k]=k=="amt"?(parseFloat(v)||0):k=="g"?+v:v;save();render()}
function delF(id){S.fixed=S.fixed.filter(function(y){return y.id!=id});save();render()}
function addF(g){S.fixed.push({id:Date.now(),g:g,name:"รายการใหม่",amt:0});save();render()}
function setG(id,v){S.groups.filter(function(g){return g.id==id})[0].name=v;save();render()}
function addG(){S.groups.push({id:Date.now(),name:"หมวดใหม่"});save();render()}
function delG(id){if(S.groups.length<2){alert("ต้องเหลืออย่างน้อย 1 หมวด");return}var o=S.groups.filter(function(g){return g.id!=id})[0].id;if(!confirm("ลบหมวดนี้? รายการข้างในจะย้ายไปหมวดอื่น"))return;S.fixed.forEach(function(x){if(x.g==id)x.g=o});S.groups=S.groups.filter(function(g){return g.id!=id});save();render()}
function setDebt(id,k,v){var d=S.debts.filter(function(x){return x.id==id})[0];d[k]=k=="name"?v:(parseFloat(v)||0);save();render()}
function addDebt(){S.debts.push({id:Date.now(),name:"บัตร/หนี้ใหม่",bal:0,min:0,apr:16});save();render()}
function delDebt(id){if(!confirm("ลบหนี้นี้และประวัติการจ่ายของมัน?"))return;S.debts=S.debts.filter(function(x){return x.id!=id});S.tx=S.tx.filter(function(t){return t.debt!=id});save();render()}

/* ---- sheet (card details) ---- */
function openSheet(t,a){sheet={t:t,a:a};render()}
function closeSheet(){sheet=null;render()}
function goTab(t){setTab(t)}
function row(l,v,c){return'<div class="row" style="--c:'+c+'"><span><i class="dot"></i>'+esc(l)+'</span><b style="color:'+c+'">'+v+'</b></div>'}
function txRow(t){var c=COL[t.cat]||"#94a3b8";return'<div class="row" style="--c:'+c+'"><span><i class="dot"></i>'+t.date.slice(8)+'/'+t.date.slice(5,7)+' '+esc(t.note||t.cat)+' <span class="tag">'+t.cat+'</span></span><span style="white-space:nowrap"><b style="color:'+c+'">'+f(t.amt)+'</b><button class="x" onclick="editTx('+t.id+')">✎</button><button class="x del" onclick="delTx('+t.id+')">✕</button></span></div>'}
function sortTx(a){return a.sort(function(x,y){return y.date<x.date?-1:y.date>x.date?1:y.id-x.id})}
function sheetHTML(c){
 var t=sheet.t,a=sheet.a,ti="",b="";
 if(t=="left"){ti="เหลือใช้เดือนนี้";b=row("รายได้","+"+f(c.inc),"var(--inc)")+S.groups.map(function(g){return row(g.name,"-"+f(gsum(g.id)),gcol(g.id))}).join("")+row("จ่ายหนี้","-"+f(c.commit),"var(--debt)")+row("ใช้จ่ายอื่น","-"+f(c.spent),"var(--exp)")+'<div class="row"><b>เหลือ</b><b style="color:'+(c.left<0?"var(--debt)":"var(--left)")+'">'+f(c.left)+' ฿</b></div><div class="mu">ใช้ได้วันละ '+f(Math.max(0,c.perDay))+' ฿ อีก '+c.days+' วัน</div>'}
 if(t=="inc"){ti="รายได้";b='<div class="mu">เงินเดือน</div><input type="number" inputmode="decimal" value="'+S.salary+'" onchange="setNum(\'salary\',this.value)" style="margin-bottom:8px"><div class="mu">OT เดือนนี้</div><input type="number" inputmode="decimal" value="'+S.ot+'" onchange="setNum(\'ot\',this.value)"><div class="row"><b>รวม</b><b style="color:var(--inc)">'+f(c.inc)+' ฿</b></div>'}
 if(t=="grp"){var g=S.groups.filter(function(x){return x.id==a})[0];if(!g){sheet=null;return""}ti=g.name;b=S.fixed.filter(function(x){return x.g==g.id}).map(function(x){return row(x.name,f(x.amt),gcol(g.id))}).join("")+'<div class="row"><b>รวม</b><b>'+f(gsum(g.id))+' ฿</b></div><button onclick="goTab(\'set\')" style="width:100%;margin-top:8px">แก้ไข เพิ่ม ลบรายการ</button>'}
 if(t=="debt"){ti="หนี้และบัตร";b=S.debts.map(function(d){var p=paid(d.id);return'<div class="row"><span><b>'+esc(d.name)+'</b><div class="mu">ขั้นต่ำ '+f(d.min)+' · จ่ายแล้ว '+f(p)+(p>=d.min&&d.min>0?" ✓":"")+'</div></span><b style="color:var(--debt)">'+f(d.bal)+'</b></div>'}).join("")+'<button onclick="goTab(\'debt\')" style="width:100%;margin-top:8px;background:var(--debt)">ไปหน้าจ่ายหนี้</button>'}
 if(t=="spent"||t=="cat"){ti=t=="cat"?a:"ใช้จ่ายอื่นเดือนนี้";var l=sortTx(monthTx().filter(function(x){return !x.debt&&(t=="spent"||x.cat==a)}));b=l.length?l.map(txRow).join(""):'<div class="mu">ไม่มีรายการ</div>'}
 return'<div class="ov" onclick="closeSheet()"><div class="sh" onclick="event.stopPropagation()"><div class="hd"><h2>'+esc(ti)+'</h2><button class="x" onclick="closeSheet()" style="font-size:20px">✕</button></div>'+b+'</div></div>'}

/* ---- charts ---- */
function waterfall(c){
 var r1=c.inc-c.fx,r2=r1-c.commit,r3=r2-c.spent;
 var items=[["รายได้",0,c.inc,"var(--inc)",c.inc],["ประจำ",r1,c.inc,"var(--rent)",c.fx],["หนี้",r2,r1,"var(--debt)",c.commit],["ใช้จ่าย",r3,r2,"var(--exp)",c.spent],["เหลือ",Math.min(0,c.left),Math.max(0,c.left),c.left<0?"var(--debt)":"var(--left)",c.left]];
 var mx=Math.max(c.inc,1),mn=Math.min(0,c.left,r3),rng=(mx-mn)||1,H=120,y=function(v){return 14+(mx-v)/rng*H},s="";
 items.forEach(function(it,i){var lo=Math.min(it[1],it[2]),hi=Math.max(it[1],it[2]),x=14+i*60,top=y(hi),h=Math.max(2,y(lo)-top);
  s+='<rect x="'+x+'" y="'+top+'" width="42" height="'+h+'" rx="6" fill="'+it[3]+'"/><text x="'+(x+21)+'" y="'+(top-4)+'" text-anchor="middle" style="fill:var(--tx);font-weight:700">'+(i&&i<4?"-":"")+f(it[4])+'</text><text x="'+(x+21)+'" y="152" text-anchor="middle">'+it[0]+'</text>'});
 return'<svg viewBox="0 0 320 160"><line x1="8" x2="312" y1="'+y(0)+'" y2="'+y(0)+'" stroke="var(--bd)"/>'+s+'</svg>'}
function daily(c){
 var B=c.inc-c.fx-c.commit,now=new Date().getDate(),cum=0,per={};
 monthTx().forEach(function(t){if(!t.debt){var d=+t.date.slice(8);per[d]=(per[d]||0)+t.amt}});
 var vals=[B];for(var d=1;d<=now;d++){cum+=per[d]||0;vals.push(B-cum)}
 var mx=Math.max(B,1),mn=Math.min(0,Math.min.apply(null,vals)),rng=(mx-mn)||1,W=290,H=100;
 var X=function(d){return 20+d/c.dim*W},Y=function(v){return 10+(mx-v)/rng*H};
 var p=vals.map(function(v,i){return(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)}).join(" "),last=vals[vals.length-1],col=last<0?"var(--debt)":"var(--left)";
 return'<svg viewBox="0 0 320 130"><line x1="20" x2="310" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="var(--debt)" stroke-dasharray="3 3" opacity=".5"/><line x1="'+X(0)+'" y1="'+Y(B)+'" x2="'+X(c.dim)+'" y2="'+Y(0)+'" stroke="var(--mu)" stroke-dasharray="4 4" opacity=".6"/><path d="'+p+'" fill="none" stroke="'+col+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+X(vals.length-1)+'" cy="'+Y(last)+'" r="5" fill="'+col+'"/><text x="20" y="124">วันที่ 1</text><text x="310" y="124" text-anchor="end">วันที่ '+c.dim+'</text><text x="22" y="8">เหลือ '+f(last)+'</text></svg>'}


/* ---- payoff plan ---- */
function setPlan(k,v){S.plan[k]=k=="strat"?v:(parseFloat(v)||0);save();render()}
function prio(ds,strat){return ds.slice().sort(function(a,b){var za=a.apr<=0?1:0,zb=b.apr<=0?1:0;if(za!=zb)return za-zb;if(strat=="bal")return a.bal-b.bal;return b.apr-a.apr||a.bal-b.bal})}
function simulate(strat,pool,roll){
 var ds=S.debts.filter(function(d){return d.bal>0}).map(function(d){return{id:d.id,bal:d.bal,min:d.min,apr:d.apr||0}});
 var order=prio(ds,strat),budget=ds.reduce(function(a,d){return a+d.min},0)+Math.max(0,pool),interest=0,tot=function(){return ds.reduce(function(a,d){return a+d.bal},0)},series=[tot()],m=0;
 while(m<240&&ds.some(function(d){return d.bal>0.5})){
  m++;ds.forEach(function(d){if(d.bal>0){var i=d.bal*d.apr/1200;d.bal+=i;interest+=i}});
  var left=budget;order.forEach(function(d){if(d.bal>0){var p=Math.min(d.bal,d.min);d.bal-=p;left-=p}});

function b64(blob){return new Promise(function(r){var fr=new FileReader();fr.onload=function(){r(fr.result.split(",")[1])};fr.readAsDataURL(blob)})}
function getKey(){try{return localStorage.getItem("debtkey")||""}catch(e){return""}}
var MON={"ม.ค.":1,"ก.พ.":2,"มี.ค.":3,"เม.ย.":4,"พ.ค.":5,"มิ.ย.":6,"ก.ค.":7,"ส.ค.":8,"ก.ย.":9,"ต.ค.":10,"พ.ย.":11,"ธ.ค.":12};
function fixDate(d,m,y){y=+y;if(y<100)y+=2500;if(y>2400)y-=543;return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0")}
async function viaClaude(blob){
 var names=S.debts.map(function(d){return d.name}).join(", ");
 var p='อ่านสลิปโอนเงินหรือใบเสร็จในรูป ตอบเป็น JSON อย่างเดียว ไม่มีข้อความอื่น รูปแบบ: {"amount":ตัวเลข,"date":"YYYY-MM-DD","receiver":"ชื่อผู้รับ/ร้าน","note":"คำอธิบายสั้นๆ ภาษาไทย","category":"อาหาร|เดินทาง|ค่าน้ำไฟ|ของใช้|อื่นๆ","debt":ชื่อหนี้หรือ null} กติกา: date เป็นปี ค.ศ. (ถ้าเป็น พ.ศ. ให้ลบ 543) อ่านไม่ได้ใช้ null; debt เป็นหนึ่งใน ['+names+'] ถ้าเป็นการจ่ายบัตร/ผ่อนของเจ้านั้น ไม่งั้น null';
 var r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":getKey(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-haiku-5-5",max_tokens:400,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:await b64(blob)}},{type:"text",text:p}]}]})});
 if(!r.ok)throw"api";var j=await r.json();return JSON.parse(j.content[0].text.match(/\{[\s\S]*\}/)[0])}
function loadTess(){return new Promise(function(res,rej){if(window.Tesseract)return res();var sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)})}
async function viaOCR(blob){
 await loadTess();
 var r=await Tesseract.recognize(blob,"tha+eng");var t=r.data.text||"";
 var amt=0,m=t.match(/(?:จำนวน(?:เงิน)?|Amount|ยอด(?:ชำระ|รวม)?)[^\d]{0,20}([\d,]+\.\d{2})/i);
 if(m)amt=parseFloat(m[1].replace(/,/g,""));
 else{var all=(t.match(/\d[\d,]*\.\d{2}/g)||[]).map(function(x){return parseFloat(x.replace(/,/g,""))});if(all.length)amt=Math.max.apply(null,all)}
 var date=null,dm=t.match(/(\d{1,2})\s*(ม\.ค\.|ก\.พ\.|มี\.ค\.|เม\.ย\.|พ\.ค\.|มิ\.ย\.|ก\.ค\.|ส\.ค\.|ก\.ย\.|ต\.ค\.|พ\.ย\.|ธ\.ค\.)\s*(\d{2,4})/);
 if(dm)date=fixDate(dm[1],MON[dm[2]],dm[3]);
 else{var d2=t.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);if(d2)date=fixDate(d2[1],d2[2],d2[3])}
 var low=t.toLowerCase(),dd=S.debts.filter(function(d){return low.indexOf(d.name.toLowerCase())>=0})[0];
 return{amount:amt,date:date,note:"",category:guess(t),debt:dd?dd.name:null}}
async function scan(file){
 busy=true;msg="";render();
 try{
  var blob=await shrink(file),j;
  if(getKey()){try{j=await viaClaude(blob)}catch(e){msg="ใช้ Claude อ่านไม่สำเร็จ (เช็ก API key/อินเทอร์เน็ต) ใช้ OCR ฟรีแทน กรุณาตรวจตัวเลข"}}
  if(!j)j=await viaOCR(blob);
  var dd=S.debts.filter(function(d){return j.debt&&d.name.toLowerCase()==String(j.debt).toLowerCase()})[0];
  pend={amt:parseFloat(j.amount)||0,date:/^\d{4}-\d{2}-\d{2}$/.test(j.date||"")?j.date:today(),note:j.note||j.receiver||"",cat:CATS.indexOf(j.category)>=0?j.category:"อื่นๆ",debt:dd?dd.id:0}
 }catch(e){msg="อ่านสลิปไม่สำเร็จ (โหมด OCR ต้องต่ออินเทอร์เน็ตครั้งแรก) ลองถ่ายให้ชัดขึ้น หรือพิมพ์บันทึกเอง"}
 busy=false;render()}
function saveKey(v){try{localStorage.setItem("debtkey",v.trim())}catch(e){}}
function backup(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="debt-backup-"+today()+".json";a.click()}
function restore(fl){var fr=new FileReader();fr.onload=function(){try{S=JSON.parse(fr.result);save();render();alert("กู้ข้อมูลแล้ว")}catch(e){alert("ไฟล์ไม่ถูกต้อง")}};fr.readAsText(fl)}

function pf(k,v){pend[k]=(k=="amt"||k=="debt")?parseFloat(v)||0:v}
function okPend(){addTx(pend.amt,pend.cat,pend.note,pend.date,pend.debt||null);pend=null;render()}
function render(){
 var c=calc();
 document.getElementById("app").innerHTML=tab=="home"?home():tab=="plan"?plan():tab=="log"?log():tab=="debt"?debts():sets();
 document.getElementById("sheet").innerHTML=sheet?sheetHTML(c):"";
 var T=[["home","📊","ภาพรวม"],["plan","🎯","แผน"],["log","➕","บันทึก"],["debt","💳","หนี้"],["set","⚙️","ตั้งค่า"]];
 document.getElementById("tabs").innerHTML=T.map(function(t){return'<button class="'+(t[0]==tab?"on":"")+'" onclick="setTab(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join("")}
document.getElementById("file").onchange=function(e){var fl=e.target.files[0];e.target.value="";if(fl){tab="log";scan(fl)}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
render();
</script>
